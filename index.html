<!DOCTYPE html>
<html lang="ja">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>オセロ</title>
<style>
body {
  touch-action: manipulation;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.controls-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  margin-top: 15px;
  padding-bottom: 30px; /* 一番下のボタンが隠れないための余白 */
}
.decide-btn{
font-size: 20px;
padding: 15px 40px;
background-color: #007bff;
color: #ffffff;
border: none;
border-radius: 8px;
cursor: pointer;
box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
}
.greenBack{
background-color: green;
}


dialog {
  border: none;
  border-radius: 8px;
  padding: 20px;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
}

dialog::backdrop {
  background-color: rgba(0, 0, 0, 0.5);
}
#myCanvas {
  /* 1. 画面の横幅と縦幅のうち、狭い方にサイズを合わせる魔法の単位「vmin」 */
  width: 90vmin;
  height: 90vmin;
}
#svg {
  /* 1. 画面の横幅と縦幅のうち、狭い方にサイズを合わせる魔法の単位「vmin」 */
  width: 90vmin;
  height: 90vmin;
  overflow: visible;
}

</style>
<body>
<!-- ダイアログ本体 -->
<dialog id="myDialog">
<h2>ゲームの設定</h2>

<button id="closeBtn" class="decide-btn">開始！</button>
</dialog>
<p id="status"></p>
<canvas id="myCanvas" width="450" height="450"></canvas>
<svg id="svg" viewBox="0 0 450 450">
<rect x="0" y="0" width="450" height="450" fill="black" rx="20" stroke="none"/>
</svg>
<div class="controls-container">
<button type="button" class="decide-btn">決定</button>
<p id="player" class="greenBack">白のターン</p>
<!-- ダイアログを開くボタン -->
<button id="openBtn">ダイアログを開く</button>
</div>
<script>
let board = Array.from({ length: 8 }, () => Array(8).fill(0));
// ② JavaScriptでCanvas要素を取得する
const canvas = document.getElementById('myCanvas');
const rect = canvas.getBoundingClientRect();
const currentWidth = rect.width;
const BASE_SIZE = 450;
let scalee = currentWidth / BASE_SIZE;
const status = document.getElementById('status');
// ③ 2D描画用の「コンテキスト」を取得する
const ctx = canvas.getContext('2d');
ctx.clearRect(0, 0, canvas.width, canvas.height);
ctx.fillStyle = 'black';
ctx.roundRect(0, 0, 450, 450,20);   
ctx.fill();
// (x座標:50, y座標:50)の位置に、幅150、高さ100の四角形を描く
ctx.fillStyle='green';
ctx.fillRect(25,25,400,400);
//横線
for(let i = 0;i<7;i++){
ctx.beginPath();
ctx.moveTo(25,75+i*50);
ctx.lineTo(425,75+i*50);
ctx.strokeStyle='black';
ctx.stroke();
}
//縦線
for(let i = 0;i<7;i++){
ctx.beginPath();
ctx.moveTo(75+i*50,25);
ctx.lineTo(75+i*50,425);
ctx.strokeStyle='black';
ctx.stroke();
}

board[3][3]=1;
board[4][4]=1;
board[3][4]=2;
board[4][3]=2;
paint();

const svgBoard = document.getElementById('svg');

const START_POS = 25;
const CELL_SIZE = 50;

for (let row = 0; row < 8; row++) {
  for (let col = 0; col < 8; col++) {
    const x = START_POS + (col * CELL_SIZE);
    const y = START_POS + (row * CELL_SIZE);

    const cell = document.createElementNS("http://w3.org", "rect");
    cell.setAttribute("x", x + 2);
    cell.setAttribute("y", y + 2);
    cell.setAttribute("width", CELL_SIZE - 4);
    cell.setAttribute("height", CELL_SIZE - 4);
    cell.setAttribute("fill", "green");
    cell.setAttribute("rx", "4");
    cell.dataset.col = col;
    cell.dataset.row = row;
    svgBoard.appendChild(cell);
  }
}

myCanvas.addEventListener('click',function(e){
scalee = currentWidth / BASE_SIZE;
const rect = canvas.getBoundingClientRect();

const mouseX = (e.clientX - rect.left)/scalee;
const mouseY = (e.clientY - rect.top)/scalee;

if(mouseX >= 25 && mouseX <= 425 && mouseY >= 25 && mouseY <= 425){
const cellX=Math.floor((mouseX-25)/50);
const cellY=Math.floor((mouseY-25)/50);
status.textContent = cellX+","+cellY;
board[cellX][cellY]=(board[cellX][cellY]+1)%3;
paint();
}else{
status.textContent = "Out of range";
}
});
function paint(){
for(let i1=0;i1<8;i1++){
for(let i2=0;i2<8;i2++){
ctx.fillStyle='green';
ctx.fillRect(30+i1*50,27+i2*50,44,44);
if(board[i1][i2] != 0){
ctx.beginPath();
ctx.arc(50+i1*50, 50+i2*50, 20, 0, Math.PI * 2);
ctx.fillStyle=board[i1][i2]==1?'white':'black';
ctx.fill();
}
}
}
}


const dialog = document.getElementById('myDialog');
const openBtn = document.getElementById('openBtn');
const closeBtn = document.getElementById('closeBtn');

// 開くボタン
openBtn.addEventListener('click', () => {
  dialog.showModal(); // モーダルとして表示
});

// 閉じるボタン（form method="dialog" があれば自動で閉じますが、JSで制御する場合）
closeBtn.addEventListener('click', () => {
  dialog.close();
});

</script>
</body>
</html>
