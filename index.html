<!DOCTYPE html>
<html lang="ja">

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" charset="utf-8">
  <title>オセロ</title>
  <style>
    body {
      touch-action: manipulation;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Hiragino Sans", sans-serif;
    }

    .controls-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      margin-top: 15px;
      padding-bottom: 30px;
      row-gap: 10px;
    }

    .decide-btn {
      font-size: 20px;
      padding: 15px 40px;
      background-color: #007bff;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .pass-btn {
      background-color: red;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .greenBack {
      background-color: green;
      font-size: 20px;
    }

    .player {
      font-size: 30px;
      font-weight: bold;
      color: white;
    }


    dialog {
      border: none;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }

    dialog::backdrop {
      background-color: rgba(0, 0, 0, 0.5);
    }

    #svg {
      /* 1. 画面の横幅と縦幅のうち、狭い方にサイズを合わせる魔法の単位「vmin」 */
      width: 90vmin;
      height: 90vmin;
      overflow: visible;
      perspective-origin: 50% 30%;
    }

    .piece-inner {
      transform-box: fill-box;
      /* ★SVG要素自身の境界を計算の基準にする */
      transform-origin: center;
      /* ★駒の中心を軸にして回す */
      transform-style: preserve-3d;
      /* 3D空間を維持 */
      transition: transform 0.6s ease-in-out;
      /* 0.6秒かけて回る */
      cursor: pointer;
      transform: perspective(400px) rotate3d(var(--rx, 0), var(--ry, 1), 0, calc(var(--flip-deg, 0) * 1deg));
      filter: drop-shadow(2px 2px 3px rgba(0, 0, 0, 0.3));
    }

    .front-group,
    .back-group {
      transform-box: fill-box;
      transform-origin: center;
      transition: opacity 0s 0.3s;
      /* 回転半ばの0.3秒後に切り替え */
    }

    .front-group {
      opacity: 1;
    }

    .back-group {
      opacity: 0;
      transform: rotateY(180deg);
    }

    /* ひっくり返った時の表裏透明度 */
    .flipped .front-group {
      opacity: 0;
    }

    .flipped .back-group {
      opacity: 1;
    }

    .no-transition .piece-inner,
    .no-transition .front-group,
    .no-transition .back-group {
      transition: none !important;
    }

    /* ラジオボタン本体を非表示化 */
    .button-group input[type="radio"] {
      display: none;
    }

    /* ラジオボタンのラベル */
    .button-group label {
      display: inline-block;
      padding: 5px 10px;
      background-color: #e0e0e0;
      color: #333;
      border: 1px solid #ccc;
      border-radius: 6px;
      cursor: pointer;
      user-select: none;
      transition: background-color 0.2s, color 0.2s;
    }

    /* 選択 */
    .button-group input[type="radio"]:checked+label {
      background-color: #007bff;
      color: #ffffff;
      /* 文字 */
      border-color: #007bff;
    }

    .dialogContainer {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .optionsContainer {
      display: flex;
      flex-direction: column;
      align-items: left;
      padding: 5px;
    }

    .option-row {
      display: flex;
      flex-direction: row;
      align-items: center;
      padding: 10px;
      font-size: 16px;
    }

    input,
    textarea,
    select {
      font-size: 16px;
    }


    .option-title {
      margin-right: 16px;
    }

    @keyframes blink {
      0% {
        opacity: 0;
      }

      100% {
        opacity: 1;
      }
    }

    .blink-icon {
      animation: blink 1s ease-in-out infinite alternate;
    }

    .back-circle {
      transform-box: fill-box;
      transform-origin: center;
      transform: rotate(calc(var(--backAngle, 0) * 1deg));
    }

    #pieceAngleSetting {
      border: 2px solid #333333;
      border-radius: 10px;
    }

    table {
      border-collapse: collapse;
      /* 境界線を重ねる */
      width: auto;
    }

    th,
    td {
      border: 1px solid #ccc;
      /* 枠線の太さ、種類、色 */
      padding: 8px;
    }

    .sub-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }
  </style>
  <dialog id="loadDialog">
    <h1>画像を読み込み中...</h1>
  </dialog>
  <!-- ダイアログ本体 -->
  <dialog id="myDialog">
    <div class="dialogContainer">
      <h2>ゲームの設定</h2>
      <div class="optionsContainer">
        <div class="option-row">
          <label class="option-title">コマの画像元:</label>
          <div>
            <div class="sub-row">
              <label>白:</label>
              <div>
                <div class="button-group">
                  <input type="radio" id="default-op-design-w" name="piece-design-w" value="default" checked>
                  <label for="default-op-design-w">デフォルト</label>

                  <input type="radio" id="url-op-design-w" name="piece-design-w" value="url">
                  <label for="url-op-design-w">URL</label>

                  <input type="radio" id="local-op-design-w" name="piece-design-w" value="local">
                  <label for="local-op-design-w">ローカルファイル</label>
                </div>
                <div id="image-file-w">
                </div>
              </div>
            </div>
            <div class="sub-row">
              <label>黒:</label>
              <div>
                <div class="button-group">
                  <input type="radio" id="default-op-design-b" name="piece-design-b" value="default" checked>
                  <label for="default-op-design-b">デフォルト</label>

                  <input type="radio" id="url-op-design-b" name="piece-design-b" value="url">
                  <label for="url-op-design-b">URL</label>

                  <input type="radio" id="local-op-design-b" name="piece-design-b" value="local">
                  <label for="local-op-design-b">ローカルファイル</label>
                </div>
                <div id="image-file-b">

                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="option-row">
          <label class="option-title">コマの形状:</label>
          <div class="button-group">
            <input type="radio" id="circle-op" name="piece-shape" value="circle" checked>
            <label for="circle-op">丸</label>

            <input type="radio" id="fill-op" name="piece-shape" value="fill">
            <label for="fill-op">埋める</label>

            <input type="radio" id="square-op" name="piece-shape" value="square">
            <label for="square-op">四角形</label>

            <input type="radio" id="star-op" name="piece-shape" value="star">
            <label for="star-op">星形</label>
          </div>
        </div>

        <div id="pieceAngleSetting">
          <label class="option-title">コマの回転設定(*コマが丸の場合のみ設定できます)</label>
          <div class="option-row">
            <label class="option-title">コマの回転軸:</label>
            <div class="button-group">
              <input type="radio" id="default-op-flip" name="flipType" value="default" checked>
              <label for="default-op-flip">デフォルト</label>

              <input type="radio" id="custom-op-flip" name="flipType" value="custom">
              <label for="custom-op-flip">カスタム</label>

              <!--<input type="radio" id="random-op-flip" name="flipType" value="random">
              <label for="random-op-flip">ランダム</label>

              <input type="radio" id="radial-op-flip" name="flipType" value="radial">
              <label for="radial-op-flip">放射状</label> -->
            </div>
          </div>
          <div class="option-row">
            <label class="option-title">カスタム値:</label>
            <input type="number" pattern="[0-9]*" id="angleOfPiece" name="angleOfPiece" min="0" max="360" step="1"
              value="0" disabled> °
            <canvas id="angleCanvas" width="70" height="60"></canvas>
          </div>
        </div>

        <div class="option-row">
          <label class="option-title">盤の色:</label><input type="color" id="boardColor" value="green">
        </div>

        <div class="option-row">
          <label class="option-title">先手:</label>
          <div class="button-group">
            <input type="radio" id="random-op-first" name="first-player" value="random" checked>
            <label for="random-op-first">ランダム</label>

            <input type="radio" id="white-op-first" name="first-player" value="white">
            <label for="white-op-first">白</label>

            <input type="radio" id="black-op-first" name="first-player" value="black">
            <label for="black-op-first">黒</label>
          </div>
        </div>
      </div>
      <!--画像切り抜きの際収めるかはみ出すかの選択肢も-->
      <button id="closeBtn" class="decide-btn">開始！</button>
    </div>
  </dialog>
  <p id="status"></p>
  <svg id="svg" viewBox="0 0 450 450">

    <!--  クリップパス：画像を綺麗な真ん丸（半径45）にくり抜くための型紙 -->

      <polygon id="star" points="
        22.50,1.00

        33.25,27.11 
        35.79,41.90 
        22.50,34.91 
        9.21,41.90

        1.00,16.63 
        15.85,14.47
        " />

  <div class="controls-container">
    <button id="decideButton" type="button" class="decide-btn" disabled>決定</button>
    <button id="passButton" type="button" class="decide-btn pass-btn">パス</button>
    <p id="player" class="greenBack"><span id="playerSpan" class="player">白</span>のターン</p>
    <table>
      <caption>コマ数</caption>
      <tbody>
        <tr>
          <th>白</th>
          <td id="whitePieceCount">2</td>
        </tr>
        <tr>
          <th>黒</th>
          <td id="blackPieceCount">2</td>
        </tr>
        <tr>
          <th>合計</th>
          <td id="totalPieceCount">4/64</td>
        </tr>
      </tbody>
    </table>
    <button id="openBtn">ダイアログを開く</button>

  <script>
    //const selectedValue = document.querySelector('input[name="group"]:checked').value;
    const dialog = document.getElementById('myDialog');
    const loadDialog = document.getElementById('loadDialog');
    const openBtn = document.getElementById('openBtn');
    const closeBtn = document.getElementById('closeBtn');
    const svgBoard = document.getElementById('svg');
    const angleOfPiece = document.getElementById('angleOfPiece');
    const angleCanvas = document.getElementById('angleCanvas');
    const ctx = angleCanvas.getContext("2d");
    const imageSelect_w = document.getElementById("image-file-w");
    const imageSelect_b = document.getElementById("image-file-b");
    const boardColor = document.getElementById('boardColor');
    const whitePieceCount = document.getElementById('whitePieceCount');
    const blackPieceCount = document.getElementById('blackPieceCount');
    const totalPieceCount = document.getElementById('totalPieceCount');
    const decideButton = document.getElementById('decideButton');
    const passButton = document.getElementById('passButton');
    const playerSpan = document.getElementById('playerSpan');
    //ラジオボタン
    const designRadios_w = document.querySelectorAll('input[name="piece-design-w"]');
    const designRadios_b = document.querySelectorAll('input[name="piece-design-b"]');
    const flipType = document.querySelectorAll('input[name="flipType"]');
    let template = document.getElementById('piece-temp-circle');

    let board = Array.from({length: 8}, () => Array(8).fill(0));

    const START_POS = 25;
    const CELL_SIZE = 50;

    let totalPiece = 4;
    let whitePiece = 2;
    let blackPiece = 2;

    let blinkPiece;

    let IsCurrentTrunBlack = false;

    const imageSelectContent = {
      default: "",
      url: '<input id="XXXXXPieceURL" type="url" value="">',
      local: '<input type="file" id="XXXXXPieceFile" accept="image/*">'
    };

    angleOfPiece.addEventListener('change', (e) => {
      angleExample(Number(e.target.value));
    });
    //ラジオボタン
    designRadios_w.forEach(radio => {
      radio.addEventListener('change', (e) => {
        imageSelect_w.innerHTML = imageSelectContent[e.target.value].replace("XXXXX", "white");
      });
    })
    designRadios_b.forEach(radio => {
      radio.addEventListener('change', (e) => {
        imageSelect_b.innerHTML = imageSelectContent[e.target.value].replace("XXXXX", "black");
      });
    })
    flipType.forEach(radio => {
      radio.addEventListener('change', (e) => {
        if (e.target.value == "custom") {
          angleOfPiece.disabled = false;
          angleExample(angleOfPiece.value);
        } else {
          angleOfPiece.disabled = true;
          angleExample("a");
        }
      });
    })
    angleExample("a");
    drawBoard();
    const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
    g.setAttribute("id", "piece-layer");
    svgBoard.appendChild(g);
    const piecesLayer = document.getElementById('piece-layer');
    dialog.showModal();

    closeBtn.addEventListener('click', () => {
      dialog.close();
      setPieceRotationAxis(Number(angleOfPiece.value));
      start();
    });
    //駒の操作

    function putPiece(row, col, isBlack = false) {
      if (board[row][col] != 0) {
        return null;
      }
      const clone = template.cloneNode(true);
      clone.removeAttribute('id');
      clone.classList.add('piece-instance');
      clone.classList.add('no-transition');
      const x = 25 + START_POS + col * CELL_SIZE;
      const y = 25 + START_POS + row * CELL_SIZE;
      clone.setAttribute('transform', `translate(${x}, ${y})`);
      if (isBlack) {
        clone.dataset.deg = 180;
        clone.style.setProperty('--flip-deg', '180');
        clone.classList.add('flipped');
      } else {
        clone.dataset.deg = 0;
        clone.style.setProperty('--flip-deg', '0');
      }
      clone.dataset.x = col;
      clone.dataset.y = row;

      piecesLayer.appendChild(clone);
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          clone.classList.remove('no-transition');
        });
      });
      return clone;
    }

    function changePiece(x, y) {
      const targetPiece = piecesLayer.querySelector(`[data-x="${x}"][data-y="${y}"]`);
      const currentDeg = (parseInt(targetPiece.dataset.deg, 10) || 0) + 180;
      targetPiece.dataset.deg = currentDeg;
      targetPiece.style.setProperty('--flip-deg', currentDeg);
      const isFlipped = (currentDeg / 180) % 2 !== 0;
      targetPiece.classList.toggle('flipped', isFlipped);
      board[y][x] = isFlipped ? 2 : 1;
      if (isFlipped) {
        blackPiece++;
        whitePiece--;
      } else {
        whitePiece++;
        blackPiece--;
      }
      whitePieceCount.textContent = whitePiece;
      blackPieceCount.textContent = blackPiece;
    }

    function drawBoard() {
      for (let row = 0; row < 8; row++) {
        for (let col = 0; col < 8; col++) {
          const x = START_POS + (col * CELL_SIZE);
          const y = START_POS + (row * CELL_SIZE);

          const cell = document.createElementNS("http://www.w3.org/2000/svg", "rect");
          cell.setAttribute("x", x + 1);
          cell.setAttribute("y", y + 1);
          cell.setAttribute("width", CELL_SIZE - 2);
          cell.setAttribute("height", CELL_SIZE - 2);
          cell.setAttribute("fill", "green");
          cell.dataset.col = col;
          cell.dataset.row = row;
          cell.classList.add("boards");
          cell.addEventListener('click', (e) => {
            const row = e.target.dataset.row;
            const col = e.target.dataset.col;
            blinkPiece?.remove();
            blinkPiece = putPiece(row, col, IsCurrentTrunBlack);
            blinkPiece.classList.add("blink-icon");
            decideButton.disabled = !(IsAbleToPut(col, row, IsCurrentTrunBlack));
          });
          svgBoard.appendChild(cell);
        }
      }
    }
    function changeBoardColor(color) {
      const boards = document.querySelectorAll('.boards');
      boards.forEach((board) => {
        board.setAttribute("fill", color);
      });
    }
    async function start() {
      piecesLayer.textContent = "";
      //ゲームのリセット・初期化
      board = Array.from({length: 8}, () => Array(8).fill(0));
      template = document.getElementById('piece-temp-' + document.querySelector('input[name="piece-shape"]:checked').value);
      const imageType_w = document.querySelector('input[name="piece-design-w"]:checked').value;
      const imageType_b = document.querySelector('input[name="piece-design-b"]:checked').value;
      let firstPlayer = document.querySelector('input[name="first-player"]:checked').value;
      let whiteUrl;
      let blackUrl;
      if (imageType_w == "url") {
        whiteUrl = document.getElementById('whitePieceURL').value;
      }
      else if (imageType_w == "local") {
        loadDialog.showModal();
        whiteUrl = await fileToDataUrl(document.getElementById('whitePieceFile').files[0]);
      }
      if (imageType_b == "url") {
        blackUrl = document.getElementById('blackPieceURL').value;
      }
      else if (imageType_b == "local") {
        blackUrl = await fileToDataUrl(document.getElementById('blackPieceFile').files[0]);
        loadDialog.close();
      }
      if (whiteUrl) {
        document.querySelectorAll('#svg defs .front-group image').forEach(img => {
          img.removeAttribute('href');
          img.setAttribute('href', whiteUrl);
        });
      }
      if (blackUrl) {
        document.querySelectorAll('#svg defs .back-group image').forEach(img => {
          img.removeAttribute('href');
          img.setAttribute('href', blackUrl);
        });
      }
      changeBoardColor(boardColor.value);
      putPiece(3, 3, false);
      putPiece(4, 4, false);
      putPiece(3, 4, true);
      putPiece(4, 3, true);
      board[3][3] = 1;
      board[4][4] = 1;
      board[4][3] = 2;
      board[3][4] = 2;
      if (firstPlayer == "random") {
        firstPlayer = Math.floor(Math.random() * 2) == 0 ? "white" : "black";
      }
      if (firstPlayer == "black") {
        playerSpan.style.color = "black";
        playerSpan.textContent = "黒";
        IsCurrentTrunBlack = true;
      }
    }

    function setPieceRotationAxis(degree) {
      const angle = (degree + 90) * (Math.PI / 180);
      svgBoard.style.setProperty('--rx', Math.cos(angle));
      svgBoard.style.setProperty('--ry', Math.sin(angle));
      svgBoard.style.setProperty('--backAngle', degree * (-2))
    }
    function angleExample(degree) {
      ctx.clearRect(0, 0, angleCanvas.width, angleCanvas.height);
      ctx.beginPath();
      ctx.arc(35, 30, 29, 0, 2 * Math.PI);

      ctx.strokeStyle = 'blue';
      ctx.lineWidth = 2;

      ctx.stroke();

      ctx.beginPath();
      const angle = (degree + 90) * (Math.PI / 180);
      ctx.moveTo(35 + Math.cos(angle) * (30), 30 + Math.sin(angle) * (30));
      ctx.lineTo(35 + Math.cos(angle) * (-30), 30 + Math.sin(angle) * (-30));
      ctx.stroke();
    }
    //ここまで

    const DIRECTIONS = [
      [0, -1],//上
      [1, -1],//右上
      [1, 0],//右
      [1, 1],//右下
      [0, 1],//下
      [-1, 1],//左下
      [-1, 0],//左
      [-1, -1]//左上
    ]

    async function fileToDataUrl(file) {
      return new Promise((resolve, reject) => {
        if (!file) {
          resolve(null);
          return;
        }
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
        reader.readAsDataURL(file);
      });
    }

    function IsAbleToPut(x, y, isBlack) {
      const sameID = isBlack ? 2 : 1;
      const differentID = isBlack ? 1 : 2;
      let currentX = Number(x);
      let currentY = Number(y);
      let flag = true;
      for (let i = 0; i < 8; i++) {
        currentX = Number(x) + DIRECTIONS[i][0];
        currentY = Number(y) + DIRECTIONS[i][1];
        if (currentX >= 8 || currentX < 0 || currentY >= 8 || currentY < 0) {
          continue;
        }
        if (board[currentY][currentX] != differentID) {
          continue;
        }
        while (flag) {
          currentX += DIRECTIONS[i][0];
          currentY += DIRECTIONS[i][1];
          if (currentX >= 8 || currentX < 0 || currentY >= 8 || currentY < 0) {
            flag = false;
          }
          else if (board[currentY][currentX] == 0) {
            flag = false;
          }
          else if (board[currentY][currentX] == sameID) {
            console.log("true");
            return true;
          }
        }
        flag = true;
      }
      console.log("false");
      return false;
    }
    decideButton.addEventListener('click', () => {
      blinkPiece.classList.remove("blink-icon");
      const isBlack = (blinkPiece.dataset.deg / 180) % 2 !== 0;
      board[blinkPiece.dataset.y][blinkPiece.dataset.x] = isBlack ? 2 : 1;
      totalPiece++;
      if (isBlack) {
        blackPiece++;
      } else {
        whitePiece++;
      }

      whitePieceCount.textContent = whitePiece;
      blackPieceCount.textContent = blackPiece;
      totalPieceCount.textContent = totalPiece + "/64";
      const x = Number(blinkPiece.dataset.x);
      const y = Number(blinkPiece.dataset.y);
      blinkPiece = null;
      playerSpan.style.color = IsCurrentTrunBlack ? "white" : "black";
      playerSpan.textContent = IsCurrentTrunBlack ? "白" : "黒";
      IsCurrentTrunBlack = IsCurrentTrunBlack ? false : true;
      decideButton.disabled = true;
      passButton.disabled = true;
      alotofchange(x, y, isBlack);
    });
    async function alotofchange(x, y, isBlack) {
      //方向別判定
      let ableToChange = [false, false, false, false, false, false, false, false];
      const sameID = isBlack ? 2 : 1;
      const differentID = isBlack ? 1 : 2;
      let currentX = Number(x);
      let currentY = Number(y);
      let flag = true;
      for (let i = 0; i < 8; i++) {
        currentX = Number(x) + DIRECTIONS[i][0];
        currentY = Number(y) + DIRECTIONS[i][1];
        if (!(currentX >= 8 || currentX < 0 || currentY >= 8 || currentY < 0)) {
          if (board[currentY][currentX] != differentID) {
            continue;
          }
        }
        while (flag) {
          currentX += DIRECTIONS[i][0];
          currentY += DIRECTIONS[i][1];
          if (currentX >= 8 || currentX < 0 || currentY >= 8 || currentY < 0) {
            flag = false;
          }
          else if (board[currentY][currentX] == 0) {
            flag = false;
          }
          else if (board[currentY][currentX] == sameID) {
            console.log("true");
            ableToChange[i] = true
          }
        }
        flag = true;
      }
      //方向別判定はここまで
      let varX = 0;
      let varY = 0;
      for (let i = 0; i < 8; i++) {
        for (let i2 = 0; i2 < 8; i2++) {
          varX = x + DIRECTIONS[i2][0] * (i + 1);
          varY = y + DIRECTIONS[i2][1] * (i + 1);
          if (ableToChange[i2] && (board[varY][varX] == differentID)) {
            changePiece(varX, varY);
          } else {
            ableToChange[i2] = false;
          }
        }
        if (ableToChange.filter(item => item === true).length == 0) {
          continue;
        }
        await sleep(300);
      }
      passButton.disabled = ((IsCurrentTrunBlack ? blackPiece : whitePiece) <= 1);
    }
    const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

    passButton.addEventListener("click", () => {
      blinkPiece?.remove();
      blinkPiece = null;
      playerSpan.style.color = IsCurrentTrunBlack ? "white" : "black";
      playerSpan.textContent = IsCurrentTrunBlack ? "白" : "黒";
      IsCurrentTrunBlack = IsCurrentTrunBlack ? false : true;
      decideButton.disabled = true;
      passButton.disabled = ((IsCurrentTrunBlack ? blackPiece : whitePiece) <= 1);
    });
  </script>
