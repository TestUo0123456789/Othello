<!DOCTYPE html>
<html lang="ja">

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>オセロ</title>
  <style>
    body {
      touch-action: manipulation;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Hiragino Sans", sans-serif;
      ;
    }

    .controls-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      margin-top: 15px;
      padding-bottom: 30px;
      /* 一番下のボタンが隠れないための余白 */
    }

    .decide-btn {
      font-size: 20px;
      padding: 15px 40px;
      background-color: #007bff;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .greenBack {
      background-color: green;
    }


    dialog {
      border: none;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }

    dialog::backdrop {
      background-color: rgba(0, 0, 0, 0.5);
    }

    #svg {
      /* 1. 画面の横幅と縦幅のうち、狭い方にサイズを合わせる魔法の単位「vmin」 */
      width: 90vmin;
      height: 90vmin;
      overflow: visible;
    }

    .piece-inner {
      transform-box: fill-box;
      /* ★SVG要素自身の境界を計算の基準にする */
      transform-origin: center;
      /* ★駒の中心を軸にして回す */
      transform-style: preserve-3d;
      /* 3D空間を維持 */
      transition: transform 0.6s ease-in-out;
      /* 0.6秒かけて回る */
      cursor: pointer;
      transform: perspective(400px) rotate3d(var(--rx, 0), var(--ry, 1), 0, calc(var(--flip-deg, 0) * 1deg));
    }

    .front-group,
    .back-group {
      transform-box: fill-box;
      transform-origin: center;
      transition: opacity 0s 0.3s;
      /* 回転半ばの0.3秒後に切り替え */
    }

    .front-group {
      opacity: 1;
    }

    .back-group {
      opacity: 0;
      transform: rotateY(180deg);
    }

    /* ひっくり返った時の表裏透明度 */
    .flipped .front-group {
      opacity: 0;
    }

    .flipped .back-group {
      opacity: 1;
    }

    .no-transition .piece-inner,
    .no-transition .front-group,
    .no-transition .back-group {
      transition: none !important;
    }

    /* ラジオボタン本体を非表示化 */
    .button-group input[type="radio"] {
      display: none;
    }

    /* ラジオボタンのラベル */
    .button-group label {
      display: inline-block;
      padding: 5px 10px;
      background-color: #e0e0e0;
      color: #333;
      border: 1px solid #ccc;
      border-radius: 6px;
      cursor: pointer;
      user-select: none;
      transition: background-color 0.2s, color 0.2s;
    }

    /* 選択 */
    .button-group input[type="radio"]:checked+label {
      background-color: #007bff;
      color: #ffffff;
      /* 文字 */
      border-color: #007bff;
    }

    .dialogContainer {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .optionsContainer {
      display: flex;
      flex-direction: column;
      align-items: left;
    }

    .option-row {
      display: flex;
      flex-direction: row;
      align-items: center;
      padding: 10px;
      font-size: 16px;
    }

    input,
    textarea,
    select {
      font-size: 16px;
    }


    .option-title {
      margin-right: 16px;
    }

    @keyframes blink {
      0% {
        opacity: 0;
      }

      100% {
        opacity: 1;
      }
    }

    .blink-icon {
      animation: blink 1s ease-in-out infinite alternate;
    }

    .back-circle {
      transform-box: fill-box;
      transform-origin: center;
      transform: rotate(calc(var(--backAngle, 0) * 1deg));
    }
  </style>
  <!-- ダイアログ本体 -->
  <dialog id="myDialog">
    <div class="dialogContainer">
      <h2>ゲームの設定</h2>

      <div class="option-row">
        <label class="option-title">コマの画像のURL:</label>
        <div>
          <label>白:</label><input id="whitePieceURL" type="url"
            value="https://upload.wikimedia.org/wikipedia/commons/d/da/Logo_JR_East.svg"><br>
          <label>黒:</label><input id="blackPieceURL" type="url"
            value="https://illustimage.com/photo/dl/1701.png?20151101">
        </div>
      </div>
      <div class="optionsContainer">
        <div class="option-row">
          <label class="option-title">コマの形状:</label>
          <div class="button-group">
            <input type="radio" id="circle-op" name="piece-shape" value="circle" checked>
            <label for="circle-op">丸</label>

            <input type="radio" id="fill-op" name="piece-shape" value="fill">
            <label for="fill-op">埋める</label>

            <input type="radio" id="square-op" name="piece-shape" value="square">
            <label for="square-op">四角形</label>

            <input type="radio" id="star-op" name="piece-shape" value="star">
            <label for="star-op">星形</label>
          </div>
        </div>

        <div class="option-row">
          <label class="option-title">コマの回転軸角度(コマが丸の場合のみ):</label>
          <input type="number" pattern="[0-9]*" id="angleOfPiece" name="angleOfPiece" min="0" max="360" step="1" value="0"> °
          <canvas id="angleCanvas" width="70" height="60"></canvas>
        </div>

        <div class="option-row">
          <label class="option-title"></label>
        </div>

        <div class="option-row">
          <label class="option-title">先手:</label>
          <div class="button-group">
            <input type="radio" id="random-op-first" name="first-player" value="random" checked>
            <label for="random-op-first">ランダム</label>

            <input type="radio" id="white-op-first" name="first-player" value="white">
            <label for="white-op-first">白</label>

            <input type="radio" id="black-op-first" name="first-player" value="black">
            <label for="black-op-first">黒</label>
          </div>
        </div>
      </div>
      //画像切り抜きの際収めるかはみ出すかの選択肢も
      <button id="closeBtn" class="decide-btn">開始！</button>
    </div>
  </dialog>
  <p id="status"></p>
  <svg id="svg" viewBox="0 0 450 450">
    <rect x="0" y="0" width="450" height="450" fill="black" rx="20" stroke="none" />
    <!--  クリップパス：画像を綺麗な真ん丸（半径45）にくり抜くための型紙 -->
    <defs>
      <polygon id="star" points="
        22.50,1.00 
        29.15,14.47 
        44.00,16.63 
        33.25,27.11 
        35.79,41.90 
        22.50,34.91 
        9.21,41.90 
        11.75,27.11 
        1.00,16.63 
        15.85,14.47
        " />
      <clipPath id="circle-clip">
        <circle cx="0" cy="0" r="19" />
      </clipPath>
      <clipPath id="star-clip">
        <use href="#star" x="-22.5" y="-22.5" />
      </clipPath>
      //丸の駒テンプレート
      <g id="piece-temp-circle">
        <g class="piece-inner">
          <!--表面-->
          <g class="front-group">
            <!-- 駒の枠線（フチをかっこよくしたい場合） -->
            <circle cx="0" cy="0" r="20" fill="white" stroke="#ccc" stroke-width="2" />
            <!-- 自由な画像（clip-pathで丸く切り抜く） -->
            <image href="https://testuo0123456789.github.io/Othello/white.png" x="-19" y="-19" width="38" height="38"
              clip-path="url(#circle-clip)" />
          </g>

          <!--裏面-->
          <g class="back-group">
            <!-- 駒の枠線 -->
            <circle cx="0" cy="0" r="20" fill="black" stroke="#333" stroke-width="2" />
            <!-- 自由な画像（clip-pathで丸く切り抜く） -->
            <image href="https://testuo0123456789.github.io/Othello/black.png" x="-19" y="-19" width="38" height="38"
              clip-path="url(#circle-clip)" class="back-circle" />
          </g>
        </g>
      </g>

      //すべて埋める形状の駒のテンプレート
      <g id="piece-temp-fill">
        <g class="piece-inner">
          <!--表面-->
          <g class="front-group">
            <!-- 駒の枠線（フチをかっこよくしたい場合） -->
            <rect x="-24" y="-24" width="48" height="48" fill="white" />
            <!-- 自由な画像（clip-pathで丸く切り抜く） -->
            <image href="https://testuo0123456789.github.io/Othello/white.png" x="-24" y="-24" width="48" height="48" />
          </g>

          <!--裏面-->
          <g class="back-group">
            <!-- 駒の枠線 -->
            <rect x="-24" y="-24" width="48" height="48" fill="black" />
            <!-- 自由な画像（clip-pathで丸く切り抜く） -->
            <image href="https://testuo0123456789.github.io/Othello/black.png" x="-24" y="-24" width="48" height="48" />
          </g>
        </g>
      </g>

      //四角い駒テンプレート
      <g id="piece-temp-square">
        <g class="piece-inner">
          <!--表面-->
          <g class="front-group">
            <!-- 駒の枠線（フチをかっこよくしたい場合） -->
            <rect x="-20" y="-20" width="40" height="40" fill="white" stroke="#ccc" stroke-width="2" />
            <!-- 自由な画像（clip-pathで丸く切り抜く） -->
            <image href="https://testuo0123456789.github.io/Othello/white.png" x="-19" y="-19" width="38" height="38" />
          </g>

          <!--裏面-->
          <g class="back-group">
            <!-- 駒の枠線 -->
            <rect x="-20" y="-20" width="40" height="40" fill="black" stroke="#333" stroke-width="2" />
            <!-- 自由な画像（clip-pathで丸く切り抜く） -->
            <image href="https://testuo0123456789.github.io/Othello/black.png" x="-19" y="-19" width="38" height="38" />
          </g>
        </g>
      </g>

      //星の駒テンプレート
      <g id="piece-temp-star">
        <g class="piece-inner">
          <!--表面-->
          <g class="front-group">
            <!-- 駒の枠線（フチをかっこよくしたい場合） -->
            <use href="#star" x="-22.5" y="-22.5" fill="white" />
            <!-- 自由な画像（clip-pathで丸く切り抜く） -->
            <image href="https://testuo0123456789.github.io/Othello/white.png" x="-20" y="-20" width="40" height="40"
              clip-path="url(#star-clip)" stroke="#ccc" strokeWidth="2" />
            <use href="#star" x="-22.5" y="-22.5" fill="none" stroke="#ccc" stroke-width="2" />
          </g>

          <!--裏面-->
          <g class="back-group">
            <!-- 駒の枠線 -->
            <use href="#star" x="-22.5" y="-22.5" fill="black" />
            <!-- 自由な画像（clip-pathで丸く切り抜く） -->
            <image href="https://testuo0123456789.github.io/Othello/black.png" x="-20" y="-20" width="40" height="40"
              clip-path="url(#star-clip)" />
            <use href="#star" x="-22.5" y="-22.5" fill="none" stroke="#333" stroke-width="2" />
          </g>
        </g>
      </g>
    </defs>
  </svg>
  <div class="controls-container">
    <button type="button" class="decide-btn">決定</button>
    <p id="player" class="greenBack">白のターン</p>
    <!-- ダイアログを開くボタン -->
    <button id="openBtn">ダイアログを開く</button>
  </div>
  <script>
    //const selectedValue = document.querySelector('input[name="group"]:checked').value;
    const dialog = document.getElementById('myDialog');
    const openBtn = document.getElementById('openBtn');
    const closeBtn = document.getElementById('closeBtn');
    const svgBoard = document.getElementById('svg');
    const angleOfPiece = document.getElementById('angleOfPiece');
    const angleCanvas = document.getElementById('angleCanvas');
    const ctx = angleCanvas.getContext("2d");
    let template = document.getElementById('piece-temp-circle');

    let board = Array.from({length: 8}, () => Array(8).fill(0));

    const START_POS = 25;
    const CELL_SIZE = 50;

    angleOfPiece.addEventListener('change', (e) => {
      angleExample(Number(e.target.value));
    });
    angleExample(0);
    drawBoard();
    const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
    g.setAttribute("id", "piece-layer");
    svgBoard.appendChild(g);
    const piecesLayer = document.getElementById('piece-layer');
    dialog.showModal();

    closeBtn.addEventListener('click', () => {
      dialog.close();
      setPieceRotationAxis(Number(angleOfPiece.value));
      start();
    });
    //駒の操作

    function putPiece(row, col, isBlack = false) {
      if (board[row][col] != 0) {
        return false;
      }
      const clone = template.cloneNode(true);
      clone.removeAttribute('id');
      clone.classList.add('piece-instance');
      clone.classList.add('no-transition');
      const x = 25 + START_POS + col * CELL_SIZE;
      const y = 25 + START_POS + row * CELL_SIZE;
      clone.setAttribute('transform', `translate(${x}, ${y})`);
      if (isBlack) {
        clone.dataset.deg = 180;
        clone.style.setProperty('--flip-deg', '180');
        clone.classList.add('flipped');
      }

      clone.addEventListener('click', function (e) {
        e.stopPropagation();
        const currentDeg = (parseInt(this.dataset.deg, 10) || 0) + 180;
        this.dataset.deg = currentDeg;
        this.style.setProperty('--flip-deg', currentDeg);
        const isFlipped = (currentDeg / 180) % 2 !== 0;
        this.classList.toggle('flipped', isFlipped);
        board[row][col] = isFlipped ? 2 : 1;
      });

      piecesLayer.appendChild(clone);
      board[row][col] = 1;
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          clone.classList.remove('no-transition');
        });
      });
      return true;
    }

    function drawBoard() {
      for (let row = 0; row < 8; row++) {
        for (let col = 0; col < 8; col++) {
          const x = START_POS + (col * CELL_SIZE);
          const y = START_POS + (row * CELL_SIZE);

          const cell = document.createElementNS("http://www.w3.org/2000/svg", "rect");
          cell.setAttribute("x", x + 1);
          cell.setAttribute("y", y + 1);
          cell.setAttribute("width", CELL_SIZE - 2);
          cell.setAttribute("height", CELL_SIZE - 2);
          cell.setAttribute("fill", "green");
          cell.dataset.col = col;
          cell.dataset.row = row;
          cell.addEventListener('click', (e) => {
            const row = e.target.dataset.row;
            const col = e.target.dataset.col;
            putPiece(row, col);
          });
          svgBoard.appendChild(cell);
        }
      }
    }

    function start() {
      piecesLayer.textContent = "";
      //ゲームのリセット・初期化
      board = Array.from({length: 8}, () => Array(8).fill(0));
      template = document.getElementById('piece-temp-' + document.querySelector('input[name="piece-shape"]:checked').value);
      const whiteUrl = document.getElementById('whitePieceURL').value;
      const blackUrl = document.getElementById('blackPieceURL').value;
      if (whiteUrl) {
        document.querySelectorAll('#svg defs .front-group image').forEach(img => {
          img.removeAttribute('href');
          img.setAttribute('href', whiteUrl);
        });
      }
      if (blackUrl) {
        document.querySelectorAll('#svg defs .back-group image').forEach(img => {
          img.removeAttribute('href');
          img.setAttribute('href', blackUrl);
        });
      }
      putPiece(3, 3, false);
      putPiece(4, 4, false);
      putPiece(3, 4, true);
      putPiece(4, 3, true);
    }

    function setPieceRotationAxis(degree) {
      const angle = (degree + 90) * (Math.PI / 180);
      svgBoard.style.setProperty('--rx', Math.cos(angle));
      svgBoard.style.setProperty('--ry', Math.sin(angle));
      svgBoard.style.setProperty('--backAngle', degree * (-2))
    }
    function angleExample(degree) {
      ctx.clearRect(0, 0, angleCanvas.width, angleCanvas.height);
      ctx.beginPath();
      ctx.arc(35, 30, 29, 0, 2 * Math.PI);

      ctx.strokeStyle = 'blue';
      ctx.lineWidth = 2;

      ctx.stroke();

      ctx.beginPath();
      const angle = (degree + 90) * (Math.PI / 180);
      ctx.moveTo(35 + Math.cos(angle) * (30), 30 + Math.sin(angle) * (30));
      ctx.lineTo(35 + Math.cos(angle) * (-30), 30 + Math.sin(angle) * (-30));
      ctx.stroke();
    }
    //ここまで
  </script>
  </body>

</html>
